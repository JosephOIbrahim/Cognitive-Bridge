[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognitive-bridge"
version = "0.1.0"
description = "MCP server implementing USD-inspired LIVRPS composition arcs as a formal argumentation framework for AI critical thinking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0",
    "numpy>=1.24",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
all = [
    "cognitive-bridge[semantic,dev]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_bridge"]
