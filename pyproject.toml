[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognitive-bridge"
version = "0.1.0"
description = "MCP server implementing USD-inspired LIVRPS composition arcs as a formal argumentation framework for AI critical thinking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0",
    "numpy>=1.24",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]
bench = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=4.0",
]
all = [
    "cognitive-bridge[semantic,dev,bench]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: tests that load heavy models (e.g. sentence-transformers); excluded from default run",
]
addopts = "-m 'not slow'"

[tool.coverage.run]
source = ["src/cognitive_bridge"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_bridge"]
