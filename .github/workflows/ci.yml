name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Fast suite (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (dev extras)
        run: pip install -e ".[dev]"

      - name: Run fast test suite
        # pyproject addopts injects `-m 'not slow'`, so the heavy
        # sentence-transformers tests are excluded here. This job is the
        # merge gate: the suite must pass. Output is teed to a file so the
        # failure-reporting step can surface it on the PR.
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-fast.txt

      - name: Report failure to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### CI failure — \`test\` job (fast suite, \`pytest -q\`)"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo '```text'
            tail -c 55000 pytest-fast.txt 2>/dev/null || echo "(no pytest output captured — failure likely occurred before pytest ran, e.g. during pip install)"
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

  coverage:
    name: Full coverage (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-sentence-transformers-v1

      - name: Install (dev + semantic extras)
        run: pip install -e ".[dev,semantic]"

      - name: Full suite with coverage (incl. slow)
        # `-m "slow or not slow"` overrides the pyproject marker filter so
        # every test runs. fail_under=85 comes from pyproject's
        # [tool.coverage.report] and blocks. Output is teed for PR reporting.
        run: |
          set -o pipefail
          pytest -m "slow or not slow" --cov=cognitive_bridge --cov-report=term-missing --cov-report=xml 2>&1 | tee pytest-cov.txt

      - name: Report failure to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### CI failure — \`coverage\` job (full suite incl. slow, \`--cov\`, fail_under=85)"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo '```text'
            tail -c 55000 pytest-cov.txt 2>/dev/null || echo "(no pytest output captured — failure likely before pytest ran)"
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
