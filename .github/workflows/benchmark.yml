name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the workflow level; the job elevates to the exact writes
# the benchmark action needs (push gh-pages history + deploy Pages + PR comment).
permissions:
  contents: read

concurrency:
  # Per-ref: a ref's runs serialise (main pushes never overlap a gh-pages
  # write); superseded PR runs cancel, but a main push is never cancelled.
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Run & publish benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push benchmark history to gh-pages (main only)
      deployments: write     # deploy the GitHub Pages site
      pull-requests: write   # comment the benchmark comparison on PRs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # Dependencies live in pyproject extras, not requirements.txt — hash
          # that so the pip cache key is valid and invalidates on dep changes.
          cache-dependency-path: pyproject.toml

      - name: Install (bench extras)
        run: pip install -e ".[bench]"

      - name: Run benchmarks
        # benchmarks/ lives outside testpaths=["tests"], so this is the only
        # place the pytest-benchmark suite runs — the merge gate never does.
        run: pytest benchmarks/ --benchmark-json output.json -q

      - name: Publish / compare
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Cognitive Bridge engine benchmarks
          tool: pytest
          output-file-path: output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: "200%"
          # Only a push to main updates the published baseline/history; a PR run
          # compares against that baseline without polluting it.
          auto-push: ${{ github.event_name == 'push' }}
          # Comment every PR run (show its perf impact inline); on main, comment
          # only when a regression trips the threshold.
          comment-always: ${{ github.event_name == 'pull_request' }}
          comment-on-alert: true
          summary-always: true
          # A >2x regression FAILS a PR check (the perf gate); it never fails a
          # main push — main only tracks the trend, so runner noise can't red it.
          # Tune via alert-threshold; the CPU benchmarks are low-variance, the two
          # I/O (usda) benchmarks are the ones to watch for occasional noise.
          fail-on-alert: ${{ github.event_name == 'pull_request' }}
